name: TwinFlight read-only migration evidence

on:
  push:
    branches: [main, "chore/**"]
  pull_request:
    branches: [main]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional YAML parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Verify preserved scenario and reject invalid YAML
        run: python -m unittest discover -s tests -p 'test_twinflight_preview.py' -v
      - name: Run preview without ROS2 or flight interface
        run: python scripts/twinflight_preview.py
