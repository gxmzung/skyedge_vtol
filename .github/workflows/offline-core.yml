name: VTOL Mission Systems — Offline Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture reproducibility metadata
        run: |
          mkdir -p evidence
          printf 'repository=%s\ncommit=%s\nrun_id=%s\nrunner=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RUNNER_OS" > evidence/metadata.txt
          python --version >> evidence/metadata.txt 2>&1
      - name: Offline structure, unit, smoke and demo evidence gate
        run: |
          set -o pipefail
          python scripts/verify_offline.py 2>&1 | tee evidence/verify.log
      - name: Upload offline evidence (not SITL proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vtol-mission-offline-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
