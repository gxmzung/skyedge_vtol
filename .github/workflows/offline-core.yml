name: VTOL Mission Systems — Offline Verification

on:
  push:
  pull_request:

jobs:
  offline-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline structure, unit, smoke and demo evidence gate
        run: python scripts/verify_offline.py
