name: SkyEdge CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check repository structure
        run: python scripts/check_structure.py

      - name: Run smoke test
        run: python scripts/smoke_test.py