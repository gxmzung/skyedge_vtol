name: TwinFlight source preservation verification

on:
  push:
    branches: [main, "chore/**"]
  pull_request:
    branches: [main]

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare all 22 migrated Git blob SHAs
        run: python3 -m unittest discover -s tests -p 'test_twinflight_source_integrity.py' -v
