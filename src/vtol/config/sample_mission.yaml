    x: 0
    y: 0
    z: 10

  - name: search_zone_a
    x: 30
    y: 15
    z: 40

  - name: search_zone_b
    x: 70
    y: 40
    z: 45

  - name: return_home
    x: 0
    y: 0
    z: 20