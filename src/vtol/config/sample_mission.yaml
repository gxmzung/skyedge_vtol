mission_name: skyedge_vtol_sample_mission
vehicle_type: vtol
mode: simulation

safety:
  min_battery_percent: 25
  min_signal_strength: 40
  min_gps_satellites: 8
  max_temperature: 75
  max_altitude: 120

waypoints:
